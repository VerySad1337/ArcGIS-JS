server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Self-signed, generated at image build time (see Dockerfile) - fine for
    # local/dev use behind localhost:8080, but browsers will show an
    # untrusted-certificate warning since nothing signed it. Swap these two
    # paths for a real cert (e.g. from a reverse proxy/Let's Encrypt) for
    # anything beyond local dev.
    ssl_certificate /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;

    # Vite content-hashes every file under /assets on each build (e.g.
    # I3SIndexInfo-CpQp5Naa.js), so a given filename's content never changes -
    # safe to cache for a year. This is also what most of the app's 3D-only
    # (SceneView) chunks are: they're dynamically imported by @arcgis/core
    # only the first time a user switches to 3D, not on initial page load.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is NOT content-hashed and is the one file whose byte content
    # legitimately changes on every deploy (it references that deploy's own
    # asset hashes). If it's cached, a browser tab left open across a
    # redeploy keeps running the old build's JS while nginx now serves a
    # dist/ with different asset hashes - any code path that only fetches a
    # chunk lazily (like the 2D/3D toggle's SceneView modules) then 404s the
    # moment it's finally exercised, well after the redeploy already
    # succeeded. no-cache forces a revalidation on every load instead.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Regenerated by docker-entrypoint.sh on every container start from the
    # runtime environment (VITE_ARCGIS_*) - must always revalidate, same
    # reasoning as index.html above, so a browser never holds onto a stale
    # config from a previous container/deploy.
    location = /env-config.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
