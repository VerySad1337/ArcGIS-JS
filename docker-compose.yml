# Run with:
#
#   docker compose up --build
#
# VITE_ARCGIS_API_KEY / VITE_ARCGIS_OAUTH_CLIENT_ID / VITE_ARCGIS_PORTAL_URL
# are runtime values now (see docker-entrypoint.sh) - Compose passes them
# into the container's environment, and env-config.js is regenerated from
# them on every container start. They are NOT build args anymore: the same
# built image works unmodified across environments, only the `environment:`
# values below (or an --env-file) need to change.
#
# Compose auto-loads a `.env` sitting next to this file (repo root) to fill
# in the ${...} references below. That root .env is an UNTRACKED COPY of
# my-arcgis-app/.env (the file Vite still reads for `npm run dev`) - kept in
# sync by hand:
#
#   cp my-arcgis-app/.env .env
#
# or skip the sync step and read the real file directly:
#
#   docker compose --env-file my-arcgis-app/.env up --build
#
# The repo-root .env must never be git-tracked - it used to be, with a real
# key committed, before history was rewritten to purge it. See
# knowledge/deployment.md for the full postmortem.
#
# ONEMAP_EMAIL / ONEMAP_PASSWORD (below, onemap-proxy service) are a real
# OneMap account login, not a scoped API key - keep them out of the tracked
# repo the exact same way, and never as VITE_-prefixed vars (those get
# baked into the frontend bundle and shipped to every browser - see
# onemap-proxy/server.js's module comment for why this account credential
# specifically can never live there).
services:
  arcgis-app:
    build:
      context: .
    environment:
      VITE_ARCGIS_API_KEY: "${VITE_ARCGIS_API_KEY:?missing - rerun with --env-file my-arcgis-app/.env}"
      VITE_ARCGIS_OAUTH_CLIENT_ID: "${VITE_ARCGIS_OAUTH_CLIENT_ID:-}"
      VITE_ARCGIS_PORTAL_URL: "${VITE_ARCGIS_PORTAL_URL:-}"
      VITE_CHAT_ENABLED: "${VITE_CHAT_ENABLED:-true}"
    ports:
      - "8080:443"
    depends_on:
      - onemap-proxy
      - mcp-chat-proxy

  # Holds the OneMap account credential server-side and hands the frontend
  # short-lived tokens via nginx's /api/onemap/ reverse-proxy rule (see
  # nginx.conf) - see onemap-proxy/server.js's module comment for why this
  # can't just be another VITE_-prefixed env var baked into the static
  # frontend bundle the way the ArcGIS key is. Not reachable from outside
  # the compose network - only arcgis-app's nginx talks to it, over the
  # Docker-internal service name below.
  onemap-proxy:
    build:
      context: ./onemap-proxy
    environment:
      ONEMAP_EMAIL: "${ONEMAP_EMAIL:?missing - set in my-arcgis-app/.env or --env-file}"
      ONEMAP_PASSWORD: "${ONEMAP_PASSWORD:?missing - set in my-arcgis-app/.env or --env-file}"

  # Local-model chatbot backend - see mcp-chat-proxy/README.md and
  # knowledge/features/chatbot-mcp-system.md. Every OLLAMA_*/model/tool
  # value is env-driven (no default model is assumed) - required vars
  # below fail the container's own startup check (config.js) if unset.
  # Not reachable from outside the compose network - only arcgis-app's
  # nginx talks to it, over the Docker-internal service name below, same
  # as onemap-proxy.
  mcp-chat-proxy:
    build:
      context: ./mcp-chat-proxy
    environment:
      OLLAMA_URL: "${OLLAMA_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:?missing - set the Ollama model tag to use in my-arcgis-app/.env or --env-file}"
      OLLAMA_TEMPERATURE: "${OLLAMA_TEMPERATURE:-}"
      OLLAMA_NUM_CTX: "${OLLAMA_NUM_CTX:-}"
      OLLAMA_REQUEST_TIMEOUT_MS: "${OLLAMA_REQUEST_TIMEOUT_MS:-}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-}"
      OLLAMA_UNLOAD_AFTER_TURN: "${OLLAMA_UNLOAD_AFTER_TURN:-}"
      ARCGIS_PORTAL_URL: "${VITE_ARCGIS_PORTAL_URL:-https://www.arcgis.com}"
      CHAT_ENABLED_TOOLS: "${CHAT_ENABLED_TOOLS:-}"
    depends_on:
      - ollama

  # Optional convenience default, not load-bearing infrastructure: if you
  # already run Ollama elsewhere, point OLLAMA_URL (above) at it and remove
  # this service (or `docker compose up --scale ollama=0`) instead of
  # running a second copy. Named volume persists pulled model weights
  # across container recreation. Not published to the host.
  ollama:
    image: ollama/ollama:latest
    environment:
      # Ollama sizes a model's KV cache for OLLAMA_NUM_PARALLEL concurrent
      # slots at load time, so the memory cost is num_ctx x this - leaving
      # it to Ollama's own auto-selection can quietly allocate several times
      # the cache this app ever uses. One browser chat panel needs exactly
      # one slot, and only one model (OLLAMA_MODEL) is ever loaded, so pin
      # both: the largest single RAM saving available here, and unlike
      # lowering OLLAMA_NUM_CTX it costs nothing in prompt capacity.
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
      # Server-side idle residency default. mcp-chat-proxy also sends
      # keep_alive per request (which overrides this), so this only governs
      # anything else talking to the same Ollama.
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-}"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
